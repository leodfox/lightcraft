name: Ardoise web bundle

on:
  push:
    branches: [ardoise]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ardoise-web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: storytold/craft-fonts
          ref: 8dcdacd5153e64560d109541a47d806f26f048c0
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ardoise-web
      - name: Install wasm-bindgen CLI
        run: |
          # Must match the wasm-bindgen version in Cargo.lock exactly (cargo xtask web checks it).
          if ! { command -v wasm-bindgen >/dev/null && wasm-bindgen --version | grep -q "$WASM_BINDGEN_VERSION"; }; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          fi
          wasm-bindgen --version
      - name: Build and zip
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-web-light
          path: dist/release/*.zip
          if-no-files-found: error
      - name: Attach to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ardoise-web-light-v0.6.0-${{ github.run_number }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Ardoise Lumière web bundle ($TAG)" \
            --notes "Web bundle built from $GITHUB_SHA (based on LightCraft v0.6.0, MIT OR Apache-2.0)." dist/release/*.zip
